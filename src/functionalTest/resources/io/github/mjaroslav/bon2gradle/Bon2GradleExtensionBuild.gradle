//file:noinspection GrPackage
buildscript {
    repositories {
        mavenCentral()
        maven {
            name 'forge'
            url 'https://maven.minecraftforge.net/'
        }
        maven { url = uri(System.getProperty("test.local.repo")) }
        maven {
            name 'jitpack'
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
        classpath("io.github.mjaroslav:Bon2Gradle:${System.getProperty("test.version")}")
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
}

apply plugin: 'java'
apply plugin: 'forge'
apply plugin: 'bon2gradle'

minecraft {
    mappings = "stable_12"
    version = "1.7.10-10.13.4.1614-1.7.10"
}

dependencies {
    implementation bon2.deobf("curse.maven:hardcore-ender-expansion-228015:2316923")
}
